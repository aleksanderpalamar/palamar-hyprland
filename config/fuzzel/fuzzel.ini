# Visual do launcher do Omarchy (walker, tema omarchy-default). Cores e ícones vêm do tema atual (hypr-theme).
[main]
font=monospace:size=13
dpi-aware=no
prompt="Aplicativos  "
placeholder=Pesquisar…
icons-enabled=yes
hide-before-typing=no
fields=name,generic,keywords,filename
match-mode=fzf
show-actions=no
terminal=kitty {cmd}
anchor=center
layer=overlay
lines=9
width=40
horizontal-pad=20
vertical-pad=20
inner-pad=10
line-height=32
image-size-ratio=1
scaling-filter=lanczos3
include=~/.local/state/hypr-theme/fuzzel.ini

[border]
width=2
radius=0
selection-radius=0
