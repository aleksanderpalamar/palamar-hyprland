general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = /home/palamar/.local/bin/hypr-after-resume
}

# Bloqueia apos 10 minutos sem atividade.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Desliga somente a imagem 30 segundos depois; qualquer atividade a restaura.
listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = /home/palamar/.local/bin/hypr-after-resume
}
